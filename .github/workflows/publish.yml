name: Publish

on:
  release:
    types:
      - edited
      - published
  workflow_dispatch:

env:
  DOCKER_IMAGE: lgcorzo/fastapi-autogen-team

concurrency:
  group: publish-workflow
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Job para generar y desplegar la documentación en GitHub Pages
  pages:
    name: Deploy Docs to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Generate documentation
        run: cargo doc --no-deps --all-features

      - name: Fix permissions
        run: |
          chmod -v -R +rX "target/doc/" | head -n 20

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          folder: target/doc/
          branch: gh-pages

  # Job para construir y publicar la imagen Docker
  packages:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha
          tags: ${{ env.DOCKER_IMAGE }}:latest,${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}
