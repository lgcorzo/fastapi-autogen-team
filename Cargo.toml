[package]
name = "fastapi-autogen-team"
version = "0.1.0"
edition = "2021"

[lib]
name = "fastapi_autogen_team"
path = "src/lib.rs"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors", "set-header", "util"] }

# LLM Framework
rig = { package = "rig-core", version = "0.34.0", features = ["all"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { version = "0.22", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.15", features = ["http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.23"

# Utils
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = "0.4"
anyhow = "1.0"
async-trait = "0.1"
thiserror = "1.0"
futures = "0.3"

[dev-dependencies]
mockito = "1.4"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"


